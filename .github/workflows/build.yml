name: Android and iOS
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build and test both platforms
        run: ./scripts/verify-builds.sh
      - name: iOS UI and UIKit shake tests
        run: ./scripts/verify-ui-tests.sh ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            netlogger/build/reports/
            iosApp/DerivedData/Logs/Test/

  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37' 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./scripts/verify-ui-tests.sh android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-reports
          path: |
            netlogger/build/reports/androidTests/
            netlogger/build/outputs/androidTest-results/
